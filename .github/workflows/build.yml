name: Build

on:
    push:
        branches:
            - main
            - next
        tags:
            - v*
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  clean: 'false'
                  fetch-depth: '0'
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              env:
                  # One install at a time: mise downloads dotnet-install.sh to one shared path for every dotnet version, so the
                  # SDK and runtime installs overwrite it under each other ("failed to execute command") when they run in parallel.
                  MISE_JOBS: '1'
              with:
                  install: true
                  cache: true
                  # Save in the post step: `mise run build` fills the npm cache (npm_config_cache lives in the mise data dir) after
                  # `mise install`, and mise-action otherwise saves right after install, leaving the npm cache out.
                  cache_save_post: true
                  cache_key_prefix: mise-v2
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            - name: 🕰️ Restore run history
              # Run history, the duration estimates and the module cache live in .modularpipelines/, which a new runner starts
              # without. Every run restores the newest one saved from main; only main saves.
              uses: actions/cache/restore@v6
              with:
                  path: .modularpipelines
                  key: modularpipelines-${{ github.workflow }}-main-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      modularpipelines-${{ github.workflow }}-main-
            - name: ⚙️ Build
              id: build
              run: |
                  mise run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: 🕰️ Save run history
              if: always() && github.ref == 'refs/heads/main'
              uses: actions/cache/save@v6
              with:
                  path: .modularpipelines
                  key: modularpipelines-${{ github.workflow }}-main-${{ github.run_id }}-${{ github.run_attempt }}
            - name: 🏺 Save GitHub event
              if: always()
              run: cp "$GITHUB_EVENT_PATH" artifacts/event.json || true
            - name: 🏺 Publish logs
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: logs
                  path: artifacts/logs/
            - name: 🏺 Publish test data
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test data
                  path: artifacts/logs/tests/
            - name: 🏺 Publish coverage data
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: artifacts/logs/coverage/
            - name: 🏺 Publish NuGet Packages
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: nuget
                  path: artifacts/nuget/
            - name: 🏺 Publish event
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: event
                  path: artifacts/event.json

    # Pushes the packages the build made to nuget.org with NuGet trusted publishing: the job trades its GitHub OIDC token
    # for a short-lived API key (valid for an hour), so no long-lived key is stored. Only version tags publish, and only this
    # job can request an OIDC token. The nuget.org trusted publishing policy names this workflow (build.yml) and the nuget
    # environment; NUGET_USER is the nuget.org profile name that owns that policy.
    publish:
        needs: build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: nuget
        permissions:
            id-token: write
        steps:
            - name: 📥 Download NuGet packages
              uses: actions/download-artifact@v8
              with:
                  name: nuget
                  path: nuget
            - name: 🔑 NuGet login
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}
            # Each .snupkg beside its .nupkg is pushed with it.
            - name: 🚀 Push to nuget.org
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: dotnet nuget push 'nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
