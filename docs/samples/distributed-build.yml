# A consumer's build workflow that runs the pipeline on several runners with
# Rocket.Surgery.ModularPipelines.Extensions.Distributed. See docs/distributed.md.
#
# - `host` publishes the build host once. Every runner runs that same Build.dll, because ModularPipelines refuses to mix
#   processes whose module and result assemblies were built separately.
# - `pipeline` runs one instance per matrix entry. Instance 0 is the master (coordinator); the others are workers.
# - Without the REDIS_URL secret (forks, Dependabot) the matrix shrinks to instance 0, which runs the normal standalone build.
name: Build

on:
    push:
        branches:
            - main
            - next
        tags:
            - v*
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

concurrency:
    group: build-${{ github.event_name }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    # The number of runners in a distributed run, master included. Keep it small: the test projects run in parallel inside one
    # TestSolution module on one runner, so extra workers only help with other modules that are not pinned to the coordinator.
    INSTANCES: "2"

jobs:
    host:
        runs-on: ubuntu-latest
        outputs:
            run-id: ${{ steps.plan.outputs.run-id }}
            instances: ${{ steps.plan.outputs.instances }}
            total: ${{ steps.plan.outputs.total }}
        steps:
            - name: 🧭 Plan the run
              id: plan
              env:
                  # The secrets context is not allowed in job conditions, so test it here and pass the answer on as an output.
                  HAS_REDIS: ${{ secrets.REDIS_URL != '' }}
              run: |
                  echo "run-id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
                  if [ "$HAS_REDIS" = "true" ]; then
                      echo "instances=$(seq -s, 0 $((INSTANCES - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
                      echo "total=${INSTANCES}" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::REDIS_URL is not available, so the build runs standalone on one runner."
                      echo "instances=[0]" >> "$GITHUB_OUTPUT"
                      echo "total=1" >> "$GITHUB_OUTPUT"
                  fi
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: "0"
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true
            # PublishAot=false: a file-based app publishes with Native AOT by default, and the conventions plugin uses reflection.
            - name: 📦 Publish the build host
              run: dotnet publish build/Build.cs -c Release -o "$RUNNER_TEMP/pipeline-host" -p:PublishAot=false
            - name: 🏺 Upload the build host
              uses: actions/upload-artifact@v7
              with:
                  name: pipeline-host-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/pipeline-host
                  retention-days: 1

    pipeline:
        needs: host
        runs-on: ubuntu-latest
        strategy:
            # A failed worker must not cancel the master: the master requeues the worker's module or fails the run itself.
            fail-fast: false
            matrix:
                instance: ${{ fromJSON(needs.host.outputs.instances) }}
        env:
            MODULARPIPELINES_INSTANCE_INDEX: ${{ matrix.instance }}
            MODULARPIPELINES_TOTAL_INSTANCES: ${{ needs.host.outputs.total }}
            MODULARPIPELINES_RUN_ID: ${{ needs.host.outputs.run-id }}
            REDIS_URL: ${{ secrets.REDIS_URL }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            # "Re-run failed jobs" restarts only some instances, which then wait for a master that never comes.
            - name: 🚫 Reject partial re-runs
              if: needs.host.outputs.run-id != format('{0}-{1}', github.run_id, github.run_attempt)
              run: |
                  echo "::error::Use 'Re-run all jobs': a distributed run cannot restart only some of its instances."
                  exit 1
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: "0"
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true
                  cache_save: ${{ matrix.instance == 0 }}
            - name: 📥 Download the build host
              uses: actions/download-artifact@v8
              with:
                  name: pipeline-host-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/pipeline-host
            # Only the master reads and writes run history, which feeds the duration estimates the scheduler orders work by.
            - name: 🗂️ Restore run history
              if: matrix.instance == 0
              uses: actions/cache@v4
              with:
                  path: .modularpipelines/run-history
                  key: mp-history-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      mp-history-${{ github.workflow }}-${{ github.ref_name }}-
                      mp-history-${{ github.workflow }}-main-
            - name: ⚙️ Run the pipeline
              run: dotnet "$RUNNER_TEMP/pipeline-host/Build.dll"
            # Everything the run produces ends up on the master: workers send their results and artifacts back through Redis.
            - name: 🏺 Publish logs
              if: always() && matrix.instance == 0
              uses: actions/upload-artifact@v7
              with:
                  name: logs
                  path: artifacts/logs/
            - name: 🏺 Publish test data
              if: always() && matrix.instance == 0
              uses: actions/upload-artifact@v7
              with:
                  name: test data
                  path: artifacts/tests/
            - name: 🏺 Publish coverage data
              if: always() && matrix.instance == 0
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: artifacts/coverage/
            - name: 🏺 Publish the run report
              if: always() && matrix.instance == 0
              uses: actions/upload-artifact@v7
              with:
                  name: run-report
                  path: artifacts/run-report.json
            - name: 🏺 Publish NuGet packages
              if: always() && matrix.instance == 0
              uses: actions/upload-artifact@v7
              with:
                  name: nuget
                  path: artifacts/nuget/

    publish:
        needs: pipeline
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: nuget
        permissions:
            id-token: write
        steps:
            - name: 📥 Download NuGet packages
              uses: actions/download-artifact@v8
              with:
                  name: nuget
                  path: nuget
            - name: 🔑 NuGet login
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}
            - name: 🚀 Push to nuget.org
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: dotnet nuget push 'nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
